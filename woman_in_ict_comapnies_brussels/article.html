<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pipeline Filled Twice as Fast as the Payroll</title>
<link rel="stylesheet" href="./montserrat.css">
<link rel="stylesheet" href="./lexend.css">
<style>
  :root{
    /* geopolitoon: parchment ground, black rules, one burnt-orange accent */
    --paper:#EFE6D2;
    --paper-2:#E7DCC2;
    --paper-3:#F8F1E1;
    --paper-4:#FCF7EC;
    --rule:#1A1712;
    --ink:#16130F;
    --ink-2:#4A443C;
    --ink-3:#857C6E;
    --line:#D8CBB0;
    --line-strong:#B9A987;
    --orange:#DD6B33;
    --orange-deep:#A83C14;
    --orange-soft:#F6DCC8;
    --navy:#24405F;
    --navy-soft:#8AA3BC;
    --green:#3F8F4A;
    --red:#C0392B;
    --display:'Montserrat',system-ui,sans-serif;
    --body:'Lexend',system-ui,sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
    --measure:60ch;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-weight:300;font-size:17px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}

  /* ---------------- language switch ---------------- */
  .langbar{
    position:fixed;top:0;left:0;right:0;z-index:60;
    background:var(--paper-2);border-bottom:3px solid var(--rule);
  }
  .langbar .inner{
    max-width:1180px;margin:0 auto;padding:9px 28px;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
  }
  .sig{
    font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--ink-2);
  }
  .sig a{color:inherit;text-decoration:none}
  .sig a:hover{color:var(--orange)}
  .langtoggle{display:flex}
  .langtoggle button{
    font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.09em;
    background:transparent;border:1px solid var(--line-strong);color:var(--ink-3);
    padding:5px 12px;cursor:pointer;
  }
  .langtoggle button:first-child{border-radius:2px 0 0 2px}
  .langtoggle button:last-child{border-radius:0 2px 2px 0;border-left:none}
  .langtoggle button[aria-pressed="true"]{
    background:var(--rule);color:var(--paper);border-color:var(--rule);
  }

  /* ---------------- hero ---------------- */
  header.hero{padding:112px 0 0}
  .kicker{
    font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--orange);margin:0 0 20px;
  }
  h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(32px,5.6vw,64px);line-height:1.04;letter-spacing:-.025em;
    margin:0 0 24px;max-width:24ch;text-wrap:balance;
  }
  .standfirst{
    font-size:clamp(18px,2vw,21px);line-height:1.55;color:var(--ink-2);
    max-width:54ch;margin:0 0 24px;
  }
  .heroskip{
    display:inline-flex;align-items:center;gap:9px;margin:0 0 34px;
    font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.04em;
    color:var(--paper);background:var(--orange-deep);border:none;cursor:pointer;
    padding:12px 20px;border-radius:2px;transition:background .15s ease;
  }
  .heroskip:hover{background:var(--orange)}
  .heroskip .arr{font-size:15px;line-height:1;transition:transform .15s ease}
  .heroskip:hover .arr{transform:translateY(2px)}
  .byline{
    font-family:var(--mono);font-size:12px;color:var(--ink-3);
    padding:14px 0;border-top:1px solid var(--line-strong);
    border-bottom:1px solid var(--line-strong);display:flex;gap:26px;flex-wrap:wrap;
  }

  .keynums{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:1px;background:var(--line-strong);border:1px solid var(--line-strong);
    margin:54px 0 0;
  }
  .keynum{background:var(--paper-4);padding:22px 22px 24px}
  .keynum .v{
    font-family:var(--display);font-weight:700;font-size:clamp(28px,3.3vw,40px);
    line-height:1;letter-spacing:-.03em;color:var(--orange-deep);
    font-variant-numeric:tabular-nums;
  }
  .keynum .k{font-size:13px;line-height:1.45;color:var(--ink-2);margin-top:9px}

  /* ---------------- prose ---------------- */
  section.prose{padding:76px 0 0}
  .prose p, .lede{margin:0 0 20px;font-size:17.5px;text-wrap:pretty}
  .lede{font-size:20px;line-height:1.55;color:var(--ink-2)}
  .prose h2{
    font-family:var(--display);font-weight:700;font-size:clamp(24px,3vw,34px);
    line-height:1.12;letter-spacing:-.015em;margin:0 0 18px;max-width:34ch;
    text-wrap:balance;
  }
  .prose h2 .n{
    display:block;font-size:11px;letter-spacing:.2em;color:var(--orange);
    margin-bottom:12px;font-weight:700;
  }
  .prose h3{
    font-family:var(--display);font-weight:700;font-size:18px;margin:34px 0 10px;
  }
  .prose strong{font-weight:500;color:var(--ink)}
  .pull{
    font-family:var(--display);font-weight:600;font-size:clamp(21px,2.6vw,29px);
    line-height:1.25;letter-spacing:-.01em;color:var(--ink);
    max-width:40ch;margin:44px 0;padding-left:22px;
    border-left:4px solid var(--orange);
  }

  /* the five activity families, as a compact key */
  .famlist{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:0;margin:24px 0 26px;
    border-top:1px solid var(--line-strong);
    border-left:1px solid var(--line-strong);
  }
  .fam{
    background:var(--paper-4);padding:14px 16px;
    border-right:1px solid var(--line-strong);
    border-bottom:1px solid var(--line-strong);
  }
  .fam .code{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--orange);
  }
  .fam .nm{font-family:var(--display);font-size:13px;font-weight:600;margin:4px 0 3px}
  .fam .ct{font-size:11.5px;color:var(--ink-3)}

  /* a definition the reader must not skip */
  .defbox{
    background:var(--paper-4);border:1px solid var(--line-strong);
    border-left:4px solid var(--navy);padding:20px 22px;margin:30px 0;
  }
  .defbox h4{
    font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--navy);margin:0 0 10px;
  }
  .defbox p{font-size:15.5px;line-height:1.6;margin:0 0 10px}
  .defbox p:last-child{margin:0}
  .defbox .yes{color:var(--green);font-weight:500}
  .defbox .no{color:var(--red);font-weight:500}

  /* ---------------- scrollytelling ---------------- */
  .scrolly{position:relative;margin:56px 0 0}
  .scrolly .inner{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
  .figcol{position:sticky;top:96px;height:min(80vh,700px);display:flex;
    flex-direction:column;justify-content:center}
  .figbox{
    background:var(--paper-4);border:1px solid var(--line-strong);
    padding:22px 22px 18px;box-shadow:0 2px 0 var(--line-strong);
  }
  .figtitle{
    font-family:var(--display);font-size:12.5px;font-weight:700;line-height:1.3;
    color:var(--ink);margin-bottom:4px;
  }
  .figsub{font-size:11.5px;color:var(--ink-3);margin-bottom:14px;line-height:1.4}
  .figbox svg{display:block;width:100%;height:auto;overflow:visible}
  .fignote{
    font-size:11.5px;color:var(--ink-3);margin-top:12px;padding-top:10px;
    border-top:1px solid var(--line);line-height:1.45;min-height:3.1em;
  }

  .steps{display:flex;flex-direction:column}
  .step{
    min-height:66vh;display:flex;flex-direction:column;justify-content:center;
    padding:26px 0;opacity:.32;transition:opacity .35s ease;
  }
  .step.on{opacity:1}
  .step p{max-width:46ch;margin:0 0 16px;font-size:17.5px}
  .step p:last-child{margin-bottom:0}
  .step .big{
    font-family:var(--display);font-weight:700;font-size:clamp(34px,4.4vw,52px);
    line-height:1;letter-spacing:-.03em;color:var(--orange-deep);
    display:block;margin-bottom:10px;font-variant-numeric:tabular-nums;
  }
  .step .label{
    font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:var(--orange);margin-bottom:12px;
  }

  .closing{
    font-family:var(--display);font-weight:600;
    font-size:clamp(19px,2.2vw,25px);line-height:1.3;letter-spacing:-.01em;
    color:var(--ink);max-width:44ch;
  }
  .annex{border-top:3px solid var(--rule);margin-top:80px;padding-top:44px}
  .annex h2 .n{color:var(--ink-3)}

  /* the interactive map, embedded as the article's finale */
  .mapfinale{margin-top:76px}
  .mapfinale h2 .n{color:var(--orange)}
  .mapframe{margin:26px 0 0}
  .mapframe iframe{
    width:100%;height:min(88vh,900px);border:1px solid var(--line-strong);
    box-shadow:0 2px 0 var(--line-strong);background:var(--paper-4);display:block;
  }
  .mapfull{margin:14px 0 0;font-family:var(--display);font-size:13px;font-weight:600}
  .mapfull a{color:var(--orange-deep);text-decoration:none}
  .mapfull a:hover{text-decoration:underline}
  @media (max-width:900px){ .mapframe iframe{height:82vh} }

  /* a standalone figure, no scroll steps */
  .solo{margin:38px 0 0}
  .solo .figbox{max-width:100%}

  /* ---------------- tables ---------------- */
  .tablewrap{overflow-x:auto;margin:34px 0 0}
  table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
  caption{
    text-align:left;font-family:var(--display);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
    padding-bottom:10px;
  }
  th{
    font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);text-align:right;
    padding:0 0 8px 14px;border-bottom:2px solid var(--rule);
  }
  th:first-child{text-align:left;padding-left:0}
  td{padding:10px 0 10px 14px;border-bottom:1px solid var(--line);text-align:right;
    font-variant-numeric:tabular-nums;color:var(--ink-2)}
  td:first-child{text-align:left;padding-left:0;color:var(--ink)}
  tbody tr:hover td{background:var(--paper-3)}
  .bar-cell{position:relative;min-width:110px}
  .bar-cell i{display:block;height:9px;background:var(--orange);border-radius:1px}
  td.sect{font-size:12px;color:var(--ink-3);text-align:left}

  /* ---------------- method + footer ---------------- */
  .method{
    background:var(--paper-2);border-top:3px solid var(--rule);
    margin-top:96px;padding:56px 0 64px;
  }
  .method h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0 0 20px}
  .method .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:34px}
  .method h3{
    font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--orange);margin:0 0 8px;
  }
  .method p{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;max-width:46ch}
  .method a{color:var(--navy);text-decoration:underline;text-underline-offset:2px}

  .cta{
    display:block;margin:44px 0 0;padding:26px 28px;background:var(--rule);
    color:var(--paper);text-decoration:none;
  }
  .cta .t{
    font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;
    display:block;margin-bottom:6px;
  }
  .cta .s{font-size:14px;color:#C9BCA0}
  .cta:hover .t{color:var(--orange)}

  footer.end{padding:34px 0 60px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

  @media (max-width:900px){
    .scrolly .inner{grid-template-columns:1fr;gap:0}
    .figcol{position:sticky;top:64px;height:auto;margin-bottom:18px;
      background:var(--paper);padding:8px 0}
    .step{min-height:auto;padding:20px 0;opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .step{opacity:1;transition:none}
  }
  :focus-visible{outline:2px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>

<div class="langbar">
  <div class="inner">
    <div class="sig"><a href="https://geopolitoon.com">geopolitoon</a> &nbsp;·&nbsp;
      <span data-i18n="dept"></span></div>
    <div class="langtoggle" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <p class="kicker" data-i18n="kicker"></p>
    <h1 data-i18n="title"></h1>
    <p class="standfirst" data-i18n="standfirst"></p>
    <button class="heroskip" id="skiptomap" type="button">
      <span data-i18n="heroMapBtn"></span>
      <span class="arr" aria-hidden="true">&#8595;</span>
    </button>
    <div class="byline">
      <span data-i18n="bylineSrc"></span>
      <span data-i18n="bylineScope"></span>
    </div>
    <div class="keynums" id="keynums"></div>
  </header>

  <!-- ============ 00 · how we counted ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a0n"></span><span data-i18n="a0h"></span></h2>
    <p class="lede" data-i18n="a0lede"></p>

    <h3 data-i18n="a0h1"></h3>
    <div class="solo">
      <div class="figbox">
        <div class="figtitle" data-i18n="figFunT"></div>
        <div class="figsub" data-i18n="figFunS"></div>
        <svg id="fig-funnel" viewBox="0 0 860 500" role="img"></svg>
        <div class="fignote" id="note-funnel"></div>
      </div>
    </div>
    <p style="margin-top:28px" data-i18n="a0p2"></p>

    <h3 data-i18n="a0h2"></h3>
    <p data-i18n="a0p3"></p>
    <div class="solo">
      <div class="figbox">
        <div class="figtitle" data-i18n="figFrameT"></div>
        <div class="figsub" data-i18n="figFrameS"></div>
        <svg id="fig-frame" viewBox="0 0 860 210" role="img"></svg>
        <div class="fignote" id="note-frame"></div>
      </div>
    </div>

    <h3 data-i18n="a0h3"></h3>
    <p data-i18n="a0p4"></p>
    <div class="famlist" id="famlist"></div>
    <p data-i18n="a0p5"></p>

    <div class="defbox">
      <h4 data-i18n="defT"></h4>
      <p data-i18n="defYes"></p>
      <p data-i18n="defNo"></p>
    </div>
  </section>

  <!-- ============ 01 · two speeds ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a1n"></span><span data-i18n="a1h"></span></h2>
    <p class="lede" data-i18n="a1lede"></p>
  </section>

  <div class="scrolly" id="sc-speed">
    <div class="inner">
      <div class="steps" data-steps="speed"></div>
      <div class="figcol">
        <div class="figbox">
          <div class="figtitle" data-i18n="figSpeedT"></div>
          <div class="figsub" data-i18n="figSpeedS"></div>
          <svg id="fig-speed" viewBox="0 0 460 320" role="img"></svg>
          <div class="fignote" id="note-speed"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 03 · every employer ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a3n"></span><span data-i18n="a3h"></span></h2>
    <p class="lede" data-i18n="a3lede"></p>
  </section>

  <div class="scrolly" id="sc-swarm">
    <div class="inner">
      <div class="steps" data-steps="swarm"></div>
      <div class="figcol">
        <div class="figbox">
          <div class="figtitle" data-i18n="figSwarmT"></div>
          <div class="figsub" data-i18n="figSwarmS"></div>
          <svg id="fig-swarm" viewBox="0 0 460 330" role="img"></svg>
          <div class="fignote" id="note-swarm"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap" style="padding:0"><p class="pull" data-i18n="pull1"></p></div>

  <!-- ============ 04 · part-time ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a4n"></span><span data-i18n="a4h"></span></h2>
    <p class="lede" data-i18n="a4lede"></p>
    <div class="solo">
      <div class="figbox">
        <div class="figtitle" data-i18n="figPtT"></div>
        <div class="figsub" data-i18n="figPtS"></div>
        <svg id="fig-pt" viewBox="0 0 860 230" role="img"></svg>
        <div class="fignote" id="note-pt"></div>
      </div>
    </div>
    <p style="margin-top:28px" data-i18n="a4p2"></p>
  </section>

  <!-- ============ 05 · sector and size ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a5n"></span><span data-i18n="a5h"></span></h2>
    <p class="lede" data-i18n="a5lede"></p>
  </section>

  <div class="scrolly" id="sc-mix">
    <div class="inner">
      <div class="steps" data-steps="mix"></div>
      <div class="figcol">
        <div class="figbox">
          <div class="figtitle" id="mix-title"></div>
          <div class="figsub" id="mix-sub"></div>
          <svg id="fig-mix" viewBox="0 0 460 320" role="img"></svg>
          <div class="fignote" id="note-mix"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 06 · what a percentage hides ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a6n"></span><span data-i18n="a6h"></span></h2>
    <p class="lede" data-i18n="a6lede"></p>
  </section>

  <div class="scrolly" id="sc-mech">
    <div class="inner">
      <div class="steps" data-steps="mech"></div>
      <div class="figcol">
        <div class="figbox">
          <div class="figtitle" id="mech-title"></div>
          <div class="figsub" data-i18n="figMechS"></div>
          <svg id="fig-mech" viewBox="0 0 460 300" role="img"></svg>
          <div class="fignote" id="note-mech"></div>
        </div>
      </div>
    </div>
  </div>

  <section class="prose">
    <p data-i18n="a6p2"></p>
  </section>

  <!-- ============ 06 · in closing ============ -->
  <section class="prose">
    <h2><span class="n" data-i18n="a8n"></span><span data-i18n="a8h"></span></h2>
    <p class="lede" data-i18n="a8lede"></p>
    <p data-i18n="a8p1"></p>
    <h3 data-i18n="a8h1"></h3>
    <p data-i18n="a8p2"></p>
    <h3 data-i18n="a8h2"></h3>
    <p data-i18n="a8p3"></p>
    <p class="kicker" style="margin:42px 0 10px" data-i18n="a8last"></p>
    <p class="closing" data-i18n="a8p4"></p>
  </section>

  <!-- ============ annex · the employers, named ============ -->
  <section class="prose annex">
    <h2><span class="n" data-i18n="a7n"></span><span data-i18n="a7h"></span></h2>
    <p class="lede" data-i18n="a7lede"></p>
    <div class="tablewrap"><table id="tbl-largest"></table></div>
    <p style="margin-top:30px" data-i18n="a7p2"></p>
    <div class="tablewrap"><table id="tbl-extremes"></table></div>
  </section>

  <!-- ============ the map, embedded as the finale ============ -->
  <section class="prose mapfinale" id="mapfinale">
    <h2><span class="n" data-i18n="a9n"></span><span data-i18n="a9h"></span></h2>
    <p class="lede" data-i18n="a9lede"></p>
    <div class="mapframe">
      <iframe src="./map.html" title="Interactive map of women on ICT payrolls"
              loading="lazy"></iframe>
    </div>
    <p class="mapfull"><a id="maplink" href="./map.html" target="_blank"
       rel="noopener" data-i18n="a9full"></a></p>
  </section>
</div>

<div class="method">
  <div class="wrap">
    <h2 data-i18n="mTitle"></h2>
    <div class="cols">
      <div>
        <h3 data-i18n="mSrcT"></h3>
        <p data-i18n="mSrcP"></p>
      </div>
      <div>
        <h3 data-i18n="mWhoT"></h3>
        <p data-i18n="mWhoP"></p>
      </div>
      <div>
        <h3 data-i18n="mHowT"></h3>
        <p data-i18n="mHowP"></p>
      </div>
      <div>
        <h3 data-i18n="mLimT"></h3>
        <p data-i18n="mLimP"></p>
      </div>
    </div>
  </div>
</div>

<div class="wrap"><footer class="end"><span data-i18n="foot"></span></footer></div>

<script src="./d3.v7.min.js"></script>
<script src="./article.js"></script>
</body>
</html>
