<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les femmes dans les effectifs TIC, employeur par employeur</title>
<link rel="stylesheet" href="./montserrat.css">
<link rel="stylesheet" href="./lexend.css">
<link rel="stylesheet" href="./tokens.css">
<style>
  :root{
    /* geopolitoon: parchment ground, black rules, one burnt-orange accent */
    --paper:#EFE6D2;
    --paper-2:#E7DCC2;
    --paper-3:#F8F1E1;
    --paper-4:#FCF7EC;
    --rule:#1A1712;
    --ink:#16130F;
    --ink-2:#4A443C;
    --ink-3:#857C6E;
    --line:#D8CBB0;
    --line-strong:#B9A987;
    --orange:#DD6B33;
    --orange-soft:#F6DCC8;
    --navy:#24405F;
    --gold:#DD6B33;
    --red:#A8362A;
    --green:#4E7C4A;
    --outside:#DED2B8;
    --thin:#CFC3A8;
    --display:'Montserrat',system-ui,sans-serif;
    --body:'Lexend',system-ui,sans-serif;
    --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-weight:300;font-size:15px;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh}

  /* ---------------- top bar ---------------- */
  .topbar{
    display:flex;flex-direction:column;gap:14px;
    padding:15px 22px 13px;background:var(--paper-2);
    border-bottom:3px solid var(--rule);
  }
  .topline{display:grid;grid-template-columns:1fr auto auto;gap:22px;align-items:start}
  .brand h1{
    font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;
    margin:0 0 3px;line-height:1.2;
  }
  .brand p{margin:0;font-size:11.5px;line-height:1.5;color:var(--ink-3);max-width:none}
  .brand .scopenote{margin-top:5px;color:var(--navy)}
  .brand .scopenote:empty{display:none}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end}
  .group{display:flex;flex-direction:column;gap:6px}
  .ctl-label{
    font-family:var(--display);font-size:9.5px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-3);
  }
  .chips{display:flex;gap:5px}
  .sizelab{display:flex;align-items:center;gap:7px}
  #sizekey{overflow:visible}
  #sizekey circle{fill:var(--ink-3)}
  .chip{
    font-family:var(--body);font-size:11.5px;color:var(--ink-2);cursor:pointer;
    background:transparent;border:1px solid var(--line-strong);border-radius:2px;
    padding:4px 9px;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-3);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--paper);font-weight:500}

  .yearline{display:flex;align-items:center;gap:10px}
  .yearline input[type=range]{width:118px;accent-color:var(--gold);cursor:pointer}
  
  .yearnow{font-family:var(--mono);font-size:14px;color:var(--gold);min-width:34px}

  .search{position:relative;width:250px}
  .search input{
    width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;
    color:var(--ink);font-family:var(--body);font-size:12.5px;padding:7px 10px;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{outline:none;border-color:var(--gold)}
  .results{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;
    background:#FCF7EC;border:1px solid var(--line-strong);border-radius:2px;
    max-height:330px;overflow-y:auto;display:none;box-shadow:0 8px 26px rgba(26,23,18,.20);
  }
  .results.on{display:block}
  .results button{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    color:var(--ink-2);font-family:var(--body);font-size:12px;padding:7px 10px;
    border-bottom:1px solid var(--line);
  }
  .results button:hover,.results button:focus{background:var(--paper-3);color:var(--ink);outline:none}
  .results .kind{
    font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.05em;
    text-transform:uppercase;margin-left:6px;
  }
  .results .none{padding:9px 10px;font-size:12px;color:var(--ink-3)}

  /* ---------------- map buttons ---------------- */
  .mapctl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:5px;z-index:10}
  .mapctl button{
    width:30px;height:30px;background:rgba(252,247,236,.95);border:1px solid var(--line-strong);
    border-radius:2px;color:var(--ink-2);font-family:var(--display);font-size:15px;
    line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);
  }
  .mapctl button:hover{border-color:var(--gold);color:var(--gold)}
  .mapctl button.reset{font-size:8px;letter-spacing:.02em;height:auto;padding:5px 0}

  .langtoggle{display:flex}
  .langtoggle button{
    font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.08em;
    background:transparent;border:1px solid var(--line-strong);color:var(--ink-3);
    padding:5px 11px;cursor:pointer;
  }
  .langtoggle button:first-child{border-radius:2px 0 0 2px}
  .langtoggle button:last-child{border-radius:0 2px 2px 0;border-left:none}
  .langtoggle button[aria-pressed="true"]{background:var(--gold);color:var(--paper);border-color:var(--gold)}

  /* ---------------- body ---------------- */
  .body{display:grid;grid-template-columns:1fr 340px;min-height:0}
  .side{box-shadow:inset 3px 0 0 var(--rule)}
  .stage{position:relative;overflow:hidden;background:#E8DCC4}
  svg#map{display:block;width:100%;height:100%;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .commune{stroke:#8E7C5C;stroke-width:.6;vector-effect:non-scaling-stroke}
  .commune.reported{cursor:pointer}
  .commune.reported:hover{stroke:var(--gold);stroke-width:1.6}
  .context{fill:#DCCFB2;stroke:#C6B896;stroke-width:.5;
    vector-effect:non-scaling-stroke;pointer-events:none}
  .firm{stroke:var(--paper-4);stroke-width:.8;cursor:pointer;vector-effect:non-scaling-stroke}
  .hit{fill:transparent;stroke:none;cursor:pointer}
  .firm:hover{stroke:var(--ink);stroke-width:1.6}
  .firm.dim{display:none}
  .firm.sel{stroke:var(--rule);stroke-width:2.4;paint-order:stroke}

  .legend{
    position:absolute;right:18px;bottom:18px;background:rgba(252,247,236,.95);
    border:1px solid var(--line);border-radius:3px;padding:13px 15px;
    font-size:12px;color:var(--ink-2);backdrop-filter:blur(6px);
  }
  .ramp{display:flex;height:9px;width:180px;margin:7px 0 4px;border-radius:1px;overflow:hidden}
  .ramp i{flex:1}
  .ramp-ends{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10.5px;color:var(--ink-3)}
  .rangefilter{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .disthint{font-size:10px;color:var(--ink-3);margin-bottom:3px;line-height:1.3}
  #dist{display:block;cursor:crosshair}
  #dist .handlebar{fill:var(--gold)}
  #dist .bar{fill-opacity:.9}
  #dist .bar.out{fill:#C9BCA0;fill-opacity:.5}
  #dist .selection{fill:var(--gold);fill-opacity:.16;stroke:var(--gold);stroke-width:1.2}
  #dist .handle{fill:var(--gold)}
  #dist .axis{fill:var(--ink-3);font-family:var(--mono);font-size:8px}
  .rangeval{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
  .rangebtns{display:flex;gap:6px}
  .rangeval span{font-family:var(--mono);font-size:10.5px;color:var(--gold)}
  .rangeval .chip{padding:2px 7px;font-size:10.5px}

  .sexsplit{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:2px;margin:12px 0 4px}
  .sexsplit div{background:var(--paper-4);padding:9px 8px;text-align:center}
  .sexsplit .k{font-size:10px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
    font-family:var(--display);font-weight:600}
  .sexsplit .v{font-family:var(--display);font-weight:700;font-size:17px;margin-top:3px;
    font-variant-numeric:tabular-nums}
  .sexsplit .v.w{color:var(--gold)}

  .yeartable{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px}
  .yeartable th{font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);text-align:right;padding:0 0 5px 0;font-weight:600}
  .yeartable th:first-child{text-align:left}
  .yeartable td{padding:5px 0;border-top:1px solid var(--line);text-align:right;
    font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .yeartable td:first-child{text-align:left;font-family:var(--mono);color:var(--ink-3)}
  .yeartable .up{color:#3F8F4A}
  .yeartable .down{color:#C0392B}
  .yeartable .flat{color:var(--ink-3)}
  .ptsentence{
    font-size:12.5px;line-height:1.55;color:var(--ink);margin:12px 0 0;
  }
  .ptsentence b{color:var(--gold);font-weight:600}

  /* ---------------- side panel ---------------- */
  .side{
    background:var(--paper-3);border-left:none;
    overflow-y:auto;padding:20px 20px 40px;
  }
  .side h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0 0 2px}
  .side .sub{font-size:12px;color:var(--ink-3);margin:0 0 16px}
  .stat{display:flex;justify-content:space-between;align-items:baseline;
    padding:9px 0;border-bottom:1px solid var(--line)}
  .stat .k{font-size:12.5px;color:var(--ink-3)}
  .stat .v{font-family:var(--display);font-weight:600;font-size:16px;
    font-variant-numeric:tabular-nums}
  .stat .v.gold{color:var(--gold)}

  .ranklist{margin:0;padding:0;list-style:none}
  .ranklist li{
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;
    padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .ranklist li:hover .nm{color:var(--gold)}
  .ranklist .nm{font-size:12.5px;line-height:1.35}
  .ranklist .meta{font-size:11px;color:var(--ink-3);margin-top:2px}
  .ranklist .pc{font-family:var(--mono);font-size:13px;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .tag-site{
    display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
    color:var(--navy);border:1px solid var(--line-strong);border-radius:2px;
    padding:0 4px;margin-left:5px;vertical-align:1px;
  }

  .spark{margin-top:10px}
  .bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .bar{display:grid;grid-template-columns:96px 1fr auto;gap:9px;align-items:center}
  .bar .bl{font-size:11.5px;color:var(--ink-2);line-height:1.25}
  .bar .bt{height:7px;background:var(--paper-2);border-radius:1px;overflow:hidden}
  .bar .bt i{display:block;height:100%}
  .bar .bv{font-family:var(--mono);font-size:11px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;white-space:pre}
  .hint{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:16px 0 0;
    padding-top:14px;border-top:1px solid var(--line)}
  .back{
    background:none;border:none;color:var(--navy);font-family:var(--body);font-size:12px;
    cursor:pointer;padding:0;margin-bottom:10px;
  }
  .back:hover{color:var(--gold)}

  .tip{
    position:absolute;pointer-events:none;background:#FCF7EC;border:1px solid var(--line-strong);
    border-radius:3px;padding:9px 12px;font-size:12.5px;opacity:0;transition:opacity .12s;
    max-width:250px;z-index:20;box-shadow:0 6px 22px rgba(26,23,18,.18);
  }
  .tip.on{opacity:1}
  .tip b{font-family:var(--display);font-weight:600;font-size:13px;display:block;margin-bottom:3px}
  .tip .r{color:var(--ink-3);font-size:11.5px}
  .tip .big{font-family:var(--mono);color:var(--gold);font-size:15px}

  .infobtn{
    width:16px;height:16px;border-radius:50%;border:1px solid var(--line-strong);
    background:transparent;color:var(--ink-3);font-family:var(--display);font-size:10px;
    font-weight:700;cursor:pointer;margin-left:7px;vertical-align:2px;line-height:1;
    padding:0;display:inline-grid;place-items:center;
  }
  .infobtn:hover{border-color:var(--gold);color:var(--gold)}
  .infobtn.sm{width:13px;height:13px;font-size:8.5px;margin-left:5px;vertical-align:0}

  .sheet{position:fixed;inset:0;background:rgba(26,23,18,.55);z-index:100;
    display:grid;place-items:center;padding:28px;backdrop-filter:blur(3px)}
  .sheet[hidden]{display:none}
  .sheetbox{
    background:var(--paper-2);border:1px solid var(--line-strong);border-radius:4px;
    max-width:660px;width:100%;max-height:82vh;overflow-y:auto;padding:26px 30px 30px;
    position:relative;box-shadow:0 20px 60px rgba(26,23,18,.22);
  }
  .sheetclose{position:absolute;top:12px;right:14px;background:none;border:none;
    color:var(--ink-3);font-size:22px;cursor:pointer;line-height:1}
  .sheetclose:hover{color:var(--gold)}
  .sheetbox h3{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 4px}
  .sheetbox h4{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold);margin:20px 0 6px}
  .sheetbox p{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin:0 0 10px;max-width:64ch}
  .sheetbox ul{margin:0 0 10px;padding-left:18px}
  .sheetbox li{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin-bottom:5px}
  .sheetbox li::marker{color:var(--line-strong)}
  .sheetbox b{color:var(--ink);font-weight:500}
  .codetable{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12px}
  .codetable th{font-family:var(--display);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-3);text-align:left;padding:0 10px 6px 0;border-bottom:1px solid var(--line-strong)}
  .codetable td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);color:var(--ink-2);
    vertical-align:top}
  .codetable td:first-child{font-family:var(--mono);color:var(--gold);white-space:nowrap}
  .codetable td:last-child{color:var(--ink);font-size:11.5px}
  .covtable td:not(:first-child),.covtable th:not(:first-child){
    text-align:right;font-variant-numeric:tabular-nums}
  .covtable td:first-child{font-family:var(--body);color:var(--ink)}
  .covtable td:last-child{font-family:var(--mono);color:var(--ink)}
  .sheetbox .lede{font-size:14px;color:var(--ink-3);margin-bottom:2px}

  .cardseg{
    margin:14px -20px 0;padding:14px 20px 18px 17px;
    border-top:1px solid var(--line-strong);
  }
  .cardseg:first-of-type{margin-top:14px}
  .cardseg.s1{background:#FCF7EC;border-left:3px solid var(--gold)}
  .cardseg.s2{background:#F6DCC8;border-left:3px solid var(--orange)}
  .cardseg.s3{background:var(--paper-4);border-left:3px solid var(--navy)}
  .cardseg.s2 .seghead{color:#DD6B33}
  .cardseg.s3 .seghead{color:var(--navy)}
  .seghead{
    font-family:var(--display);font-size:9.5px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .seghead::after{content:"";flex:1;height:1px;background:var(--line)}
  .readout{
    font-size:12px;line-height:1.55;color:var(--ink-2);margin:12px 0 0;
    background:var(--paper-2);border-left:2px solid var(--navy);padding:9px 11px;border-radius:0 2px 2px 0;
  }
  .ptchart{margin-top:6px}
  .ptchart .lab{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
  .ptchart .val{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
  .ptlegend{display:flex;gap:14px;margin-top:7px;font-size:11px;color:var(--ink-3)}
  .ptlegend span{display:inline-flex;align-items:center;gap:5px}
  .ptlegend i{width:9px;height:9px;border-radius:1px;display:inline-block}

  @media (max-width:1180px){
    .topbar{
    border-bottom:3px solid var(--rule);grid-template-columns:1fr auto;gap:14px}
    .toolbar{grid-column:1 / -1}
  }
  @media (max-width:900px){
    .body{grid-template-columns:1fr;grid-template-rows:1fr 280px}
    .side{border-left:none;border-top:1px solid var(--line-strong)}
    .legend{display:none}
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topline">
      <div class="brand">
        <h1><span data-i18n="title"></span><button class="infobtn" id="about"
            aria-label="Methodology">i</button></h1>
        <p data-i18n="standfirstA"></p>
        <p data-i18n="standfirstB"></p>
        <p class="scopenote" id="scopenote"></p>
      </div>

      <div class="search">
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               aria-label="Search" data-i18n-ph="searchPlaceholder">
        <div class="results" id="results" role="listbox"></div>
      </div>

      <div class="langtoggle" role="group" aria-label="Language">
        <button id="lang-fr" aria-pressed="false">FR</button>
        <button id="lang-en" aria-pressed="true">EN</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="group">
        <div class="ctl-label"><span data-i18n="metric"></span><button
            class="infobtn sm" id="measurehelp" aria-label="About this measure">?</button></div>
        <div class="chips" id="metricmode"></div>
      </div>
      <div class="group">
        <div class="ctl-label" data-i18n="view"></div>
        <div class="chips" id="viewmode"></div>
      </div>
      <div class="group">
        <div class="ctl-label" data-i18n="scope"></div>
        <div class="chips" id="scopemode"></div>
      </div>
      <div class="group">
        <div class="ctl-label" data-i18n="sector"></div>
        <div class="chips" id="families"></div>
      </div>
      <div class="group">
        <div class="ctl-label sizelab"><span data-i18n="size"></span><svg id="sizekey"
             aria-hidden="true"></svg></div>
        <div class="chips" id="sizes"></div>
      </div>
    </div>
  </header>

  <div class="body">
    <div class="stage">
      <svg id="map" role="img" aria-labelledby="maptitle"><title id="maptitle"></title></svg>
      <div class="mapctl">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">&minus;</button>
        <button id="zoom-reset" class="reset" data-i18n="reset"></button>
      </div>
      <div class="legend">
        <div class="ctl-label" id="legend-title"></div>
        <div class="ramp" id="ramp"></div>
        <div class="ramp-ends"><span id="ramp-lo"></span><span id="ramp-hi"></span></div>
        <div class="rangefilter">
          <div class="disthint" data-i18n="distHint"></div>
          <svg id="dist" viewBox="0 0 180 54" width="180" height="54"></svg>
          <div class="rangeval"><span id="rangetext"></span><span class="rangebtns"><button id="rangetop"
               class="chip" data-i18n="topOnly"></button><button id="rangeclear"
               class="chip" data-i18n="rangeAll"></button></span></div>
        </div>
      </div>
      <div class="tip" id="tip"></div>
    </div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
      <div class="sheetbox">
        <button class="sheetclose" id="sheetclose" aria-label="Close">&times;</button>
        <div id="sheetbody"></div>
      </div>
    </div>

    <aside class="side" id="side"></aside>
  </div>

</div>

<script src="./d3.v7.min.js"></script>
<script src="./map.js?v=4"></script>
</body>
</html>
